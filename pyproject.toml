[tool.poetry]
name = "comfy-meta-viewer"
version = "1.0.0"
description = "ComfyUI image metadata viewer"
authors = ["Lotargo"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
flask = "^3.1"
pillow = "^11.0"
pydantic = "^2.0"
watchdog = "^6.0"
send2trash = "^2.1"
keyring = "^25.7"
telethon = "^1.44"
qrcode = "^8.2"
opentelemetry-api = "^1.27"
opentelemetry-sdk = "^1.27"
opentelemetry-instrumentation-flask = "^0.48b0"
opentelemetry-exporter-otlp-proto-http = "^1.27"
waitress = "^3.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pyrefly = "^1.3.2"
rich = "14.3.4"
ruff = "0.16.9"

[tool.poetry.group.desktop.dependencies]
pyinstaller = "^6.22.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
lint.ignore = [
    "BLE001",
    "S110",
    "TRY004",
    "PYI036",
    "SIM117",
    "SIM102",
    "SIM118",
    "S112",
    "ISC004",
    "RUF059",
    "RUF012",
    "TRY401",
    "PYI034",
    "PIE810",
    "TRY002",
    "B017",
]

