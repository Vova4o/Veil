{# The media lightbox shared by Viewer and Create. lightbox_full adds Viewer's cutout and delete tools. #}
<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-top">
        <span class="lb-title" id="lb-title"></span>
        <span class="lb-counter" id="lb-counter"></span>
        <div class="lb-zoom-controls">
            <button class="lb-btn" id="lb-zoom-out" title="Zoom out (-)">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <span class="lb-zoom-level" id="lb-zoom-level">100%</span>
            <button class="lb-btn" id="lb-zoom-in" title="Zoom in (+)">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="lb-btn" id="lb-zoom-reset" title="Reset zoom (0)">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <div class="lb-separator"></div>
            <button class="lb-btn" id="lb-rotate-ccw" title="Rotate left">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </button>
            <button class="lb-btn" id="lb-rotate-cw" title="Rotate right">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>
            </button>
        </div>
        <button class="lb-btn" id="lb-toggle-meta" title="Toggle metadata panel (M)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
        </button>
        <button class="lb-btn" id="lb-view-original" title="View original in a new tab">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"></path><path d="M10 14L21 3"></path><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path></svg>
        </button>
        <button class="lb-btn" id="lb-download" title="Download media">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="lb-btn" id="lb-remix" title="Remix in Create: open as a Variation">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3h4v4"></path><path d="m21 3-6 6"></path><path d="M7 21H3v-4"></path><path d="m3 21 6-6"></path><path d="M14 5h-3a6 6 0 0 0-6 6v1"></path><path d="M10 19h3a6 6 0 0 0 6-6v-1"></path></svg>
        </button>
{% if lightbox_full %}
        <button class="lb-btn" id="lb-cutout" title="Select object">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M9 9h6v6H9z"></path></svg>
        </button>
        <button class="lb-btn lb-delete" id="lb-delete" title="Delete current asset (Delete)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
{% endif %}
        <button class="btn btn-sm" id="lb-copy" title="Copy all metadata (C)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>Copy All
        </button>
        <button class="lb-btn" id="lb-close" title="Close (Esc)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
    <div class="lightbox-body">
        <div class="lightbox-image-area">
            <button class="lb-nav prev" id="lb-prev" title="Previous media">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <img id="lb-img" src="" alt="" draggable="false" decoding="async" title="Drag to pan when zoomed">
            <video id="lb-video" controls preload="metadata" hidden></video>
            <button class="lb-nav next" id="lb-next" title="Next media">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
        <div class="lightbox-meta-panel open" id="lb-meta"></div>
{% if lightbox_full %}
        <aside class="cutout-panel" id="cutout-panel" aria-label="Object cutout panel">
            <div class="cutout-header">
                <div>
                    <h3>Object Cutout</h3>
                    <p id="cutout-status">Select an object to create a transparent PNG.</p>
                </div>
                <button class="lb-btn" id="cutout-close" title="Close cutout panel">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="cutout-preview" id="cutout-preview">
                <div class="cutout-empty">No cutout yet</div>
            </div>
            <div class="cutout-actions">
                <button class="btn btn-primary" id="cutout-download" disabled>Download PNG</button>
                <button class="btn btn-secondary" id="cutout-regenerate" disabled>Regenerate</button>
                <button class="btn btn-secondary" id="cutout-clear" disabled>Clear Cache</button>
            </div>
        </aside>
{% endif %}
    </div>
</div>
