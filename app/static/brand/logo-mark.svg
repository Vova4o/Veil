<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800" role="img" aria-labelledby="title desc">
  <title id="title">VEIL — transparent draped V monogram</title>
  <desc id="desc">Transparent vector logo: brushed-silver letter V with layered ivory satin veils, edited as separate SVG paths.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="53%" r="57%">
      <stop offset="0" stop-color="#101016"/><stop offset="0.49" stop-color="#06060a"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>
    <radialGradient id="floor" cx="50%" cy="50%" rx="50%" ry="50%">
      <stop offset="0" stop-color="#d6d5df" stop-opacity=".36"/>
      <stop offset=".24" stop-color="#9b9bab" stop-opacity=".19"/>
      <stop offset=".67" stop-color="#696977" stop-opacity=".035"/>
      <stop offset="1" stop-color="#7a7a88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="backlit" cx="49%" cy="47%" r="60%">
      <stop offset="0" stop-color="#ecedf8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8b8495" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLeft" x1="0" y1="0" x2="1" y2=".66" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f8f8fb"/><stop offset=".24" stop-color="#d7d8de"/>
      <stop offset=".50" stop-color="#777984"/><stop offset=".68" stop-color="#dbdce3"/>
      <stop offset="1" stop-color="#f4f4f8"/>
    </linearGradient>
    <linearGradient id="metalRight" x1="0" y1="0" x2=".87" y2="1">
      <stop offset="0" stop-color="#6b707b"/>
      <stop offset=".20" stop-color="#fafafd"/>
      <stop offset=".44" stop-color="#d5d6dd"/>
      <stop offset=".69" stop-color="#fafafd"/>
      <stop offset="1" stop-color="#bbc0c9"/>
    </linearGradient>
    <linearGradient id="bevelLeft" x1=".14" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#f9f9fa"/><stop offset=".36" stop-color="#dbdee4"/>
      <stop offset=".55" stop-color="#fcfbfa"/><stop offset="1" stop-color="#cfd1d9"/>
    </linearGradient>
    <linearGradient id="bevelRight" x1=".1" y1=".18" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fa"/><stop offset=".35" stop-color="#e2e2e5"/>
      <stop offset=".69" stop-color="#b9bcc5"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="darkMetalLeft" x1=".21" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32343e"/><stop offset=".36" stop-color="#8c8f9a"/>
      <stop offset=".69" stop-color="#d4d6dc"/><stop offset="1" stop-color="#fefeff"/>
    </linearGradient>
    <linearGradient id="darkMetalRight" x1="1" y1="0" x2=".18" y2="1">
      <stop offset="0" stop-color="#32353d"/><stop offset=".45" stop-color="#8c909c"/>
      <stop offset=".77" stop-color="#d0d2da"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <!-- Silk is made of overlapping gradient-filled paths, never a bitmap. -->
    <linearGradient id="silkOverall" x1=".13" y1=".02" x2=".83" y2="1">
      <stop offset="0" stop-color="#fcfcfd"/>
      <stop offset=".21" stop-color="#ffffff"/>
      <stop offset=".44" stop-color="#e4e5e8"/>
      <stop offset=".61" stop-color="#a1a5ad"/>
      <stop offset=".8" stop-color="#4e505a"/>
      <stop offset="1" stop-color="#252731"/>
    </linearGradient>
    <linearGradient id="wingLeft" x1=".04" y1=".14" x2=".96" y2=".94">
      <stop offset="0" stop-color="#f7f8f9"/>
      <stop offset=".2" stop-color="#ffffff"/>
      <stop offset=".43" stop-color="#eff0f1"/>
      <stop offset=".62" stop-color="#b4b6bc"/>
      <stop offset=".78" stop-color="#858893"/>
      <stop offset="1" stop-color="#e4e5e8"/>
    </linearGradient>
    <linearGradient id="wingRight" x1=".17" y1=".11" x2=".88" y2="1">
      <stop offset="0" stop-color="#fdfdff"/><stop offset=".14" stop-color="#fff"/>
      <stop offset=".32" stop-color="#eff0f3"/>
      <stop offset=".57" stop-color="#a5a8b0"/>
      <stop offset=".79" stop-color="#535660"/>
      <stop offset="1" stop-color="#d6d9de"/>
    </linearGradient>
    <linearGradient id="whiteRibbon" x1=".12" y1=".02" x2=".8" y2=".96">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".27" stop-color="#fdfdfe"/>
      <stop offset=".51" stop-color="#dcdee4"/>
      <stop offset=".73" stop-color="#fff"/>
      <stop offset="1" stop-color="#858b95"/>
    </linearGradient>
    <linearGradient id="greyRibbon" x1=".1" y1="0" x2=".91" y2=".96">
      <stop offset="0" stop-color="#9b9fa7"/>
      <stop offset=".22" stop-color="#e5e6e9"/>
      <stop offset=".43" stop-color="#747782"/>
      <stop offset=".66" stop-color="#e9e9ed"/>
      <stop offset="1" stop-color="#454750"/>
    </linearGradient>
    <linearGradient id="softSatin" x1=".12" y1=".1" x2=".79" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#e9eaef" stop-opacity=".9"/>
      <stop offset=".67" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#777983" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rightFold" x1=".26" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f7f7f9"/>
      <stop offset=".7" stop-color="#a6a9b1"/>
      <stop offset="1" stop-color="#545761"/>
    </linearGradient>
    <linearGradient id="shadowRibbon" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#a4a6ae"/><stop offset=".36" stop-color="#6d707a"/>
      <stop offset=".72" stop-color="#353640"/><stop offset="1" stop-color="#b9bbc3"/>
    </linearGradient>
    <linearGradient id="lightEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".86"/>
      <stop offset=".8" stop-color="#f6f6fa" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="ribbonDarkEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c46" stop-opacity="0"/>
      <stop offset=".36" stop-color="#42464f" stop-opacity=".25"/>
      <stop offset=".73" stop-color="#191b22" stop-opacity=".70"/>
      <stop offset="1" stop-color="#19191e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blurSmall" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="soft"/>
      <feOffset in="soft" dy="2" result="offset"/>
      <feComponentTransfer in="offset" result="shade"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftSilkClip"><path d="M 56,124 C 91,113 116,116 139,133 C 159,151 167,193 190,210 Q 198,220 207,209 C 219,194 229,144 249,128 C 268,112 303,116 344,123 C 312,130 303,147 292,168 C 281,187 264,211 247,228 C 229,245 215,252 197,257 C 175,246 160,220 149,194 C 137,167 119,128 56,124 Z"/></clipPath>
    <clipPath id="metalClip"><path d="M 103,170 L 137,172 L 198,260 L 259,172 L 296,170 L 198,308 Z"/></clipPath>
  </defs>


  <!-- Machined aluminium V, fully visible below the hanging fabric. -->
  <g id="metal-V" filter="url(#shadow)">
    <path d="M 103,170 L 137,172 L 198,260 L 198,308 Z" fill="url(#metalLeft)"/>
    <path d="M 296,170 L 259,172 L 198,260 L 198,308 Z" fill="url(#metalRight)"/>
    <path d="M 114,174 L 133,177 L 198,260 L 198,281 Z" fill="url(#bevelLeft)"/>
    <path d="M 285,174 L 265,178 L 198,260 L 198,281 Z" fill="url(#bevelRight)"/>
    <path d="M 130,177 L 145,187 L 198,260 L 198,280 Z" fill="url(#darkMetalLeft)" opacity=".87"/>
    <path d="M 269,177 L 253,187 L 198,260 L 198,280 Z" fill="url(#darkMetalRight)" opacity=".85"/>
    <path d="M 141,185 L 198,260 L 259,185 L 247,208 L 198,280 L 149,208 Z" fill="#101116" opacity=".34"/>
    <path d="M 105,170 L 198,307 L 295,170" fill="none" stroke="#f1f2f6" stroke-opacity=".36" stroke-width=".55"/>
    <path d="M 133,177 L 198,260 L 266,177" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".75"/>
    <path d="M 198,262 L 198,308" fill="none" stroke="#fff" stroke-opacity=".66" stroke-width=".7"/>
    <path d="M 198,307 L 214,286" stroke="#d0d1df" opacity=".5" stroke-width=".6"/>
    <path d="M 198,307 L 179,280" stroke="#c5c8d0" opacity=".38" stroke-width=".6"/>
  </g>

  <!-- Overall silhouette; individual folds below follow cloth tension toward the V. -->
  <g id="silk" filter="url(#shadow)">
    <path d="M 56,124 C 91,113 116,116 139,133 C 159,151 167,193 190,210 Q 198,220 207,209 C 219,194 229,144 249,128 C 268,112 303,116 344,123 C 312,130 303,147 292,168 C 281,187 264,211 247,228 C 229,245 215,252 197,257 C 175,246 160,220 149,194 C 137,167 119,128 56,124 Z" fill="url(#silkOverall)"/>

    <!-- Underlying drapery, darker narrow folds collecting at centre. -->
    <path d="M 79,123 C 114,129 137,163 152,193 C 168,223 181,245 198,250 C 219,242 234,215 250,187 C 267,157 291,133 325,123 C 303,128 280,140 260,173 C 241,208 224,235 200,247 C 181,241 172,211 155,181 C 133,141 108,124 79,123 Z" fill="url(#shadowRibbon)" opacity=".65"/>
    <path d="M 91,128 C 131,143 144,183 164,214 C 178,237 185,247 198,249 C 216,244 231,224 244,205 C 262,178 278,141 307,128 C 280,147 270,174 251,211 C 229,245 212,253 197,257 C 177,245 160,220 149,194 C 129,151 116,136 91,128 Z" fill="url(#greyRibbon)" opacity=".79"/>
    <path d="M 114,138 C 140,157 157,198 174,218 C 181,227 191,237 198,235 C 218,232 236,205 252,175 C 269,146 289,129 322,124 C 284,135 264,173 246,206 C 230,239 210,249 199,249 C 183,243 166,218 154,196 C 135,160 124,146 114,138 Z" fill="#3c3f49" opacity=".64"/>
    <path d="M 108,135 C 130,144 143,162 161,198 C 177,230 186,235 198,240 C 217,238 235,213 249,186 C 269,151 291,124 331,122 C 306,125 275,146 257,185 C 236,226 217,246 198,246 C 182,242 168,218 156,196 C 138,161 122,140 108,135 Z" fill="url(#greyRibbon)" opacity=".79"/>

    <!-- Left upper surface: luminous satin, falling diagonally into the valley. -->
    <path d="M 57,124 C 91,114 114,118 132,128 C 154,141 165,170 175,192 Q 189,218 198,217 C 184,224 175,213 164,196 C 151,177 146,156 130,141 C 111,125 89,124 57,124 Z" fill="url(#wingLeft)"/>
    <path d="M 58,124 C 101,113 119,129 138,151 C 156,173 168,200 185,214 C 169,204 158,181 146,161 C 121,124 97,118 58,124 Z" fill="url(#whiteRibbon)" opacity=".98"/>
    <path d="M 67,122 C 101,117 125,126 142,148 C 154,163 168,196 186,213 C 166,202 153,180 140,156 C 121,128 101,122 67,122 Z" fill="#fff" opacity=".52"/>
    <path d="M 76,122 C 111,121 130,137 149,169 C 165,194 177,217 198,224 C 178,223 159,199 145,173 C 127,140 105,122 76,122 Z" fill="url(#greyRibbon)" opacity=".51"/>
    <path d="M 83,124 C 112,124 132,143 150,177 C 166,209 182,224 199,225 C 178,233 161,205 146,180 C 121,135 105,129 83,124 Z" fill="url(#whiteRibbon)" opacity=".69"/>
    <path d="M 97,126 C 124,133 140,156 155,188 C 170,218 182,231 198,232 C 179,237 167,216 152,195 C 128,156 120,135 97,126 Z" fill="url(#greyRibbon)" opacity=".71"/>
    <path d="M 111,132 C 133,149 148,177 163,204 C 175,224 187,240 198,238 C 182,241 169,223 158,206 C 144,179 129,146 111,132 Z" fill="#f4f5f6" opacity=".64"/>

    <!-- Right upper surface: fabric curling over itself toward the opening. -->
    <path d="M 344,123 C 310,117 276,115 255,125 C 235,134 229,157 220,180 C 209,204 203,214 198,217 C 208,222 220,209 230,193 C 241,173 245,148 264,136 C 282,125 315,125 344,123 Z" fill="url(#wingRight)"/>
    <path d="M 344,123 C 301,112 274,116 252,134 C 236,147 229,169 218,194 C 211,207 205,216 199,221 C 219,212 231,189 239,169 C 259,129 286,119 344,123 Z" fill="url(#whiteRibbon)" opacity=".97"/>
    <path d="M 339,122 C 300,117 274,120 257,136 C 238,152 231,184 216,203 C 235,184 239,151 262,138 C 280,127 310,123 339,122 Z" fill="#fff" opacity=".59"/>
    <path d="M 341,123 C 298,123 268,129 250,152 C 235,171 228,206 198,227 C 223,219 237,202 253,170 C 270,141 299,127 341,123 Z" fill="url(#greyRibbon)" opacity=".79"/>
    <path d="M 333,123 C 301,127 272,137 255,163 C 241,184 229,218 198,234 C 229,222 244,194 261,170 C 280,144 302,132 333,123 Z" fill="url(#whiteRibbon)" opacity=".64"/>
    <path d="M 321,122 C 288,129 271,145 256,177 C 244,203 227,227 198,241 C 231,233 251,201 265,175 C 280,147 304,131 321,122 Z" fill="url(#greyRibbon)" opacity=".72"/>
    <path d="M 313,125 C 282,138 266,159 254,189 C 244,212 224,234 198,246 C 229,240 251,209 262,184 C 278,154 290,137 313,125 Z" fill="#d9dbe1" opacity=".48"/>

    <!-- Rolled lip of the right veil: wider, sideways silk ripples. -->
    <path d="M 228,173 C 242,140 250,127 274,120 C 298,114 321,119 343,123 C 321,123 308,131 292,132 C 277,133 262,128 249,149 C 238,166 236,179 228,194 Z" fill="url(#rightFold)" opacity=".74"/>
    <path d="M 240,158 C 255,129 269,126 290,126 C 310,126 325,127 342,123 C 323,129 319,136 301,136 C 288,136 278,132 263,144 C 252,152 247,161 240,172 Z" fill="url(#softSatin)" opacity=".86"/>
    <path d="M 248,154 C 266,137 277,131 295,133 C 317,139 327,129 343,123 C 330,140 322,145 305,145 C 288,141 277,139 259,158 Z" fill="url(#greyRibbon)" opacity=".43"/>
    <path d="M 263,147 C 287,128 303,144 321,137 C 330,134 336,127 342,123 C 326,142 320,157 302,157 C 288,158 281,148 263,164 Z" fill="url(#rightFold)" opacity=".41"/>

    <!-- Broad, softly glowing overlapping satin folds around the centre. -->
    <path d="M 115,138 C 139,157 148,187 169,207 C 178,217 187,225 200,225 C 220,222 236,196 249,173 C 244,199 225,227 206,230 C 189,234 173,224 160,207 C 145,185 136,156 115,138 Z" fill="url(#softSatin)" opacity=".67"/>
    <path d="M 130,156 C 155,184 164,215 180,225 C 190,232 202,238 215,228 C 231,219 242,195 256,173 C 247,207 227,234 207,239 C 190,245 177,236 169,225 C 152,204 142,172 130,156 Z" fill="url(#softSatin)" opacity=".46"/>
    <path d="M 146,185 C 160,208 176,231 189,235 C 207,245 228,227 245,206 C 227,238 216,246 199,249 C 176,246 158,212 146,185 Z" fill="url(#softSatin)" opacity=".3"/>

    <!-- Small shadows at the change of direction; these sit between fabric layers. -->
    <path d="M 147,180 C 170,225 184,238 199,238 C 216,236 232,216 248,189 C 233,223 217,245 199,247 C 176,243 164,221 147,180 Z" fill="#34363f" opacity=".42"/>
    <path d="M 150,189 C 174,228 184,240 199,242 C 216,241 231,221 247,196 C 235,225 218,253 198,253 C 177,250 161,220 150,189 Z" fill="url(#shadowRibbon)" opacity=".65"/>
    <path d="M 161,205 C 174,227 186,245 198,245 C 216,245 229,227 238,211 C 229,233 215,251 198,251 C 182,249 170,227 161,205 Z" fill="#f4f4f6" opacity=".52"/>
    <path d="M 172,227 C 181,239 189,250 199,249 C 208,249 216,243 225,231 C 218,249 208,257 197,256 C 186,252 177,242 172,227 Z" fill="#24262d" opacity=".76"/>

    <!-- Fine highlights and curved creases run along the fabric, not across it. -->
    <g fill="none" stroke-linecap="round">
      <path d="M 58,123 C 96,113 126,119 144,143 C 158,161 169,195 186,210 C 193,217 197,217 200,214" stroke="#fff" stroke-width="1.45" opacity=".89"/>
      <path d="M 70,121 C 108,119 130,133 148,164 C 161,187 179,216 194,220" stroke="#fff" stroke-width="1.4" opacity=".67"/>
      <path d="M 89,123 C 116,130 132,149 149,182 C 164,210 182,226 197,226" stroke="#fcfdff" stroke-width="1.15" opacity=".65"/>
      <path d="M 114,135 C 138,160 146,183 164,210 C 175,227 185,234 197,236" stroke="#fff" stroke-width=".94" opacity=".69"/>
      <path d="M 106,133 C 128,147 141,173 155,200 C 173,229 185,238 197,240" stroke="#3e424d" stroke-width="1.25" opacity=".43"/>
      <path d="M 341,122 C 305,114 276,113 257,126 C 237,140 230,167 219,190 C 211,206 203,218 198,217" stroke="#fff" stroke-width="1.55" opacity=".92"/>
      <path d="M 339,124 C 303,122 272,123 253,145 C 237,163 232,193 214,212" stroke="#fff" stroke-width="1.05" opacity=".64"/>
      <path d="M 326,125 C 286,129 268,140 252,163 C 234,191 228,216 201,232" stroke="#fcfdff" stroke-width="1.42" opacity=".72"/>
      <path d="M 314,128 C 282,137 266,157 253,184 C 239,212 226,228 201,243" stroke="#fff" stroke-width=".9" opacity=".45"/>
      <path d="M 323,126 C 290,139 272,162 260,185 C 248,211 225,240 200,248" stroke="#40434b" stroke-width="1.35" opacity=".48"/>
      <path d="M 149,187 C 165,220 182,242 199,244 C 217,244 232,223 249,191" stroke="#fff" stroke-width=".82" opacity=".57"/>
      <path d="M 158,202 C 169,223 184,249 198,250 C 214,251 228,232 242,212" stroke="#1b1b22" stroke-width="1.15" opacity=".53"/>
      <path d="M 170,226 C 181,245 191,252 198,252 C 210,253 218,243 226,231" stroke="#e6e7ea" stroke-width=".68" opacity=".45"/>
    </g>
    <!-- A very fine light-touched upper edge. -->
    <path d="M 56,124 C 92,115 117,115 138,133 M 344,123 C 302,114 272,113 250,129" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1"/>
  </g>

  <!-- Tiny stage reflection and reflected apex, understated for an icon. -->
</svg>
